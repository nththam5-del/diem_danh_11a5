<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh 11A5 - THPT Bình Thạnh Đông</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #ffffff; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    .tag { display: inline-block; background-color: #e0e7ff; color: #3730a3; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    h2 { color: #1e3a8a; font-size: 20px; margin-bottom: 4px; }
    p.sub { color: #64748b; font-size: 13px; margin-bottom: 16px; }
    .field { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; background: #fff; }
    select:focus, input:focus { border-color: #2563eb; }
    button { width: 100%; padding: 14px; background-color: #2563eb; color: #ffffff; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 6px; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .alert { padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 14px; display: none; line-height: 1.4; text-align: left; }
    .success { background-color: #dcfce7; color: #166534; }
    .error { background-color: #fee2e2; color: #991b1b; }
    .credit { margin-top: 18px; padding-top: 12px; border-top: 1px dashed #e2e8f0; font-size: 12px; color: #64748b; }
    .credit strong { color: #1e3a8a; }
  </style>
</head>
<body>

<div class="card">
  <span class="tag">THPT BÌNH THẠNH ĐÔNG</span>
  <h2>ĐIỂM DANH LỚP 11A5</h2>
  <p class="sub">Hệ thống quét mã xác thực vị trí</p>

  <form id="attForm">
    <div class="field">
      <label for="student">1. Họ và tên học sinh:</label>
      <select id="student" required>
        <option value="">-- Chọn tên trong danh sách --</option>
        <option value="2503669204">01 - Bùi Quốc Anh</option>
        <option value="2200306855">02 - Nguyễn Thị Kim Anh</option>
        <option value="2200306818">03 - Lê Gia Bảo</option>
        <option value="2200306856">04 - Nguyễn Thanh Gia Bảo</option>
        <option value="2200306891">05 - Đỗ Vũ Bình</option>
        <option value="2200306858">06 - Nguyễn Thị Chăm</option>
        <option value="2103442802">07 - Nguyễn Thị Huỳnh Châu</option>
        <option value="2206118334">08 - Nguyễn Thị Kim Duyên</option>
        <option value="2103873381">09 - Trác Trùng Dương</option>
        <option value="2103442814">10 - Đỗ Minh Định</option>
        <option value="2103442817">11 - Trương Thị Thu Hà</option>
        <option value="2206118221">12 - Nguyễn Thị Gia Hân</option>
        <option value="2107719617">13 - Trần Phú Hội</option>
        <option value="2206118222">14 - Nguyễn Phát Huy</option>
        <option value="2305241737">15 - Nguyễn Quốc Huy</option>
        <option value="2206118342">16 - Trần Mỹ Huyền</option>
        <option value="2103442833">17 - Trần Thị Diễm Hương</option>
        <option value="2200306790">18 - Phan Văn Kiệt</option>
        <option value="2206118269">19 - Lê Hoàng Long</option>
        <option value="2200306869">20 - Nguyễn Phước Lộc</option>
        <option value="2206118303">21 - Diệp Hữu Luân</option>
        <option value="2200306797">22 - Đặng Thị Thanh Mai</option>
        <option value="2103442863">23 - Nguyễn Gia Minh</option>
        <option value="2206118230">24 - Thân Nguyễn Huyền My</option>
        <option value="2103442868">25 - Trần Du Mỹ</option>
        <option value="2206118231">26 - Lê Thị Bích Ngọc</option>
        <option value="2206118237">27 - Nguyễn Thị Tú Oanh</option>
        <option value="2203951254">28 - Lê Hoàng Phúc</option>
        <option value="2206118239">29 - Đặng Lê Phương</option>
        <option value="2200306805">30 - Nguyễn Thị Như Quỳnh</option>
        <option value="2103442915">31 - Hồ Minh Tiến</option>
        <option value="2206118288">32 - Hồ Nguyễn Hồng Vân</option>
        <option value="2103442945">33 - Trần Thị Như Ý</option>
        <option value="2206118213">34 - Lê Thị Kim Yến</option>
        <option value="2406998181">35 - Trương Văn Hào</option>
      </select>
    </div>

    <div class="field">
      <label for="passcode">2. Mã xác thực (4 số cuối Mã HS):</label>
      <input type="password" id="passcode" maxlength="4" placeholder="Nhập 4 số cuối" required inputmode="numeric">
    </div>

    <button type="button" id="btnSubmit" onclick="guiDiemDanh()">Xác Nhận Có Mặt</button>
  </form>

  <div id="msg" class="alert"></div>

  <div class="credit">
    Thiết kế & Bản quyền: <strong>NGUYỄN THẮM</strong>
  </div>
</div>

<script>
  // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA DẤU NGOẶC KÉP NÀY:
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxskvJCmH_rXmUKYdju0Xa8CxDyxJ_SNjou-K925QHgd7ncaulC5J_Lvan1SZlvVxmC/exec";

  const TRUONG_LAT = 10.5372;
  const TRUONG_LNG = 105.1524;

  function tinhKhoangCach(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  function baoLoi(text, thanhCong) {
    const msg = document.getElementById("msg");
    msg.className = thanhCong ? "alert success" : "alert error";
    msg.innerHTML = text;
    msg.style.display = "block";
  }

  function guiDiemDanh() {
    const select = document.getElementById("student");
    const maHS = select.value;
    const tenHS = select.options[select.selectedIndex].text;
    const pin = document.getElementById("passcode").value.trim();
    const btn = document.getElementById("btnSubmit");

    if (!maHS) {
      baoLoi("Vui lòng chọn tên học sinh!", false);
      return;
    }

    if (pin !== maHS.slice(-4)) {
      baoLoi("Mã xác thực không đúng! Vui lòng nhập đúng 4 số cuối Mã HS.", false);
      return;
    }

    const gioHienTai = new Date().getHours();
    const caHienTai = (gioHienTai < 12) ? "sang" : "chieu";
    const khoaMay = new Date().toISOString().slice(0, 10) + "_" + caHienTai;

    if (localStorage.getItem("da_diem_danh_11a5") === khoaMay) {
      baoLoi("Thiết bị này đã hoàn thành điểm danh cho buổi học này!", false);
      return;
    }

    btn.disabled = true;
    btn.innerText = "Đang kiểm tra vị trí...";

    if (!navigator.geolocation) {
      baoLoi("Điện thoại không hỗ trợ định vị vị trí.", false);
      btn.disabled = false;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const khoangCach = tinhKhoangCach(pos.coords.latitude, pos.coords.longitude, TRUONG_LAT, TRUONG_LNG);
        btn.innerText = "Đang lưu dữ liệu...";

        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            studentId: maHS,
            studentName: tenHS,
            distance: khoangCach
          })
        }).then(() => {
          localStorage.setItem("da_diem_danh_11a5", khoaMay);
          baoLoi(`Điểm danh thành công!<br><strong>${tenHS}</strong><br>Ghi nhận lúc: ${new Date().toLocaleTimeString('vi-VN')}`, true);
          btn.innerText = "Đã hoàn thành";
        }).catch(() => {
          baoLoi("Lỗi mạng, vui lòng kiểm tra lại 4G/Wi-Fi!", false);
          btn.disabled = false;
          btn.innerText = "Xác Nhận Có Mặt";
        });
      },
      (err) => {
        baoLoi("Vui lòng BẬT ĐỊNH VỊ (GPS) trên điện thoại và cho phép trình duyệt truy cập vị trí.", false);
        btn.disabled = false;
        btn.innerText = "Xác Nhận Có Mặt";
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
</script>

</body>
</html>
