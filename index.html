<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh 11A5 - THPT Bình Thạnh Đông</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 14px; }
    .card { background: #ffffff; width: 100%; max-width: 410px; padding: 22px; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); text-align: center; }
    .tag { display: inline-block; background-color: #e0e7ff; color: #3730a3; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    h2 { color: #1e3a8a; font-size: 19px; margin-bottom: 2px; }
    p.sub { color: #64748b; font-size: 13px; margin-bottom: 12px; }
    .field { text-align: left; margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    select, input[type="password"] { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; }
    select:focus, input[type="password"]:focus { border-color: #2563eb; }

    /* Khung Camera & Ảnh Chụp Trực Tiếp */
    .cam-box { position: relative; width: 100%; height: 230px; border-radius: 12px; overflow: hidden; background: #0f172a; border: 2px solid #3b82f6; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
    #capturedPhoto { width: 100%; height: 100%; object-fit: cover; display: none; }
    canvas { display: none; }

    .cam-ctrl { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-cam-action { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-snap { background-color: #0284c7; color: #ffffff; }
    .btn-retake { background-color: #64748b; color: #ffffff; display: none; }
    .btn-open-cam { background-color: #f59e0b; color: #ffffff; display: none; }

    .btn-submit { width: 100%; padding: 13px; background-color: #2563eb; color: #ffffff; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; line-height: 1.4; text-align: left; }
    .success { background-color: #dcfce7; color: #166534; }
    .error { background-color: #fee2e2; color: #991b1b; }
    .dev-badge { font-family: monospace; font-size: 10.5px; color: #94a3b8; margin-top: 8px; word-break: break-all; }
    .credit { margin-top: 14px; padding-top: 10px; border-top: 1px dashed #e2e8f0; font-size: 12px; color: #64748b; }
    .credit strong { color: #1e3a8a; }
  </style>
</head>
<body>

<div class="card">
  <span class="tag">THPT BÌNH THẠNH ĐÔNG</span>
  <h2>ĐIỂM DANH LỚP 11A5</h2>
  <p class="sub">Chụp ảnh khuôn mặt & khóa máy cố định</p>

  <form id="attForm">
    <div class="field">
      <label for="student">1. Họ và tên học sinh:</label>
      <select id="student" required>
        <option value="">-- Danh sách 35 học sinh --</option>
        <option value="2503669204">01 - Bùi Quốc Anh</option>
        <option value="2200306855">02 - Nguyễn Thị Kim Anh</option>
        <option value="2200306818">03 - Lê Gia Bảo</option>
        <option value="2200306856">04 - Nguyễn Thanh Gia Bảo</option>
        <option value="2200306891">05 - Đỗ Vũ Bình</option>
        <option value="2200306858">06 - Nguyễn Thị Chăm</option>
        <option value="2103442802">07 - Nguyễn Thị Huỳnh Châu</option>
        <option value="2206118334">08 - Nguyễn Thị Kim Duyên</option>
        <option value="2103873381">09 - Trác Trùng Dương</option>
        <option value="2103442814">10 - Đỗ Minh Định</option>
        <option value="2103442817">11 - Trương Thị Thu Hà</option>
        <option value="2206118221">12 - Nguyễn Thị Gia Hân</option>
        <option value="2107719617">13 - Trần Phú Hội</option>
        <option value="2206118222">14 - Nguyễn Phát Huy</option>
        <option value="2305241737">15 - Nguyễn Quốc Huy</option>
        <option value="2206118342">16 - Trần Mỹ Huyền</option>
        <option value="2103442833">17 - Trần Thị Diễm Hương</option>
        <option value="2200306790">18 - Phan Văn Kiệt</option>
        <option value="2206118269">19 - Lê Hoàng Long</option>
        <option value="2200306869">20 - Nguyễn Phước Lộc</option>
        <option value="2206118303">21 - Diệp Hữu Luân</option>
        <option value="2200306797">22 - Đặng Thị Thanh Mai</option>
        <option value="2103442863">23 - Nguyễn Gia Minh</option>
        <option value="2206118230">24 - Thân Nguyễn Huyền My</option>
        <option value="2103442868">25 - Trần Du Mỹ</option>
        <option value="2206118231">26 - Lê Thị Bích Ngọc</option>
        <option value="2206118237">27 - Nguyễn Thị Tú Oanh</option>
        <option value="2203951254">28 - Lê Hoàng Phúc</option>
        <option value="2206118239">29 - Đặng Lê Phương</option>
        <option value="2200306805">30 - Nguyễn Thị Như Quỳnh</option>
        <option value="2103442915">31 - Hồ Minh Tiến</option>
        <option value="2206118288">32 - Hồ Nguyễn Hồng Vân</option>
        <option value="2103442945">33 - Trần Thị Như Ý</option>
        <option value="2206118213">34 - Lê Thị Kim Yến</option>
        <option value="2406998181">35 - Trương Văn Hào</option>
      </select>
    </div>

    <div class="field">
      <label for="passcode">2. Mã xác thực (4 số cuối CCCD):</label>
      <input type="password" id="passcode" maxlength="4" placeholder="Nhập 4 số cuối Căn cước" required inputmode="numeric">
    </div>

    <div class="field">
      <label>3. Camera trước trực tiếp:</label>
      <div class="cam-box">
        <video id="webcam" autoplay playsinline muted></video>
        <img id="capturedPhoto" alt="Ảnh chân dung đã chụp">
        <canvas id="photoCanvas" width="400" height="300"></canvas>
      </div>

      <div class="cam-ctrl">
        <button type="button" id="btnSnap" class="btn-cam-action btn-snap" onclick="chupAnhNgay()">📸 Chụp Ảnh Ngay</button>
        <button type="button" id="btnRetake" class="btn-cam-action btn-retake" onclick="chupLai()">🔄 Chụp Lại</button>
        <button type="button" id="btnOpenCam" class="btn-cam-action btn-open-cam" onclick="khoiDongCamera()">🔓 Bật Lại Camera</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="btnSubmit" onclick="guiDiemDanh()">Xác Nhận & Gửi Điểm Danh</button>
  </form>

  <div id="msg" class="alert"></div>
  <div class="dev-badge" id="devInfo"></div>

  <div class="credit">
    Thiết kế & Bản quyền: <strong>NGUYỄN THẮM</strong>
  </div>
</div>

<script>
  // DÁN LINK APPS SCRIPT CỦA BẠN VÀO ĐÂY:
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwGa5hk42QU7Lqkv947zILiAUM-UjeDtiGa9bfbSG4IErWEAye5ejTC6gOny0x9tUbcA/exec";

  const TRUONG_LAT = 10.5372;
  const TRUONG_LNG = 105.1524;
  const video = document.getElementById("webcam");
  const capturedPhoto = document.getElementById("capturedPhoto");
  const canvas = document.getElementById("photoCanvas");
  const btnSnap = document.getElementById("btnSnap");
  const btnRetake = document.getElementById("btnRetake");
  const btnOpenCam = document.getElementById("btnOpenCam");

  let streamGoc = null;
  let finalBase64Image = "";

  function getDeviceId() {
    let id = localStorage.getItem("btd_device_token");
    if (!id) {
      id = "DEV-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
      localStorage.setItem("btd_device_token", id);
    }
    return id;
  }
  const myDeviceId = getDeviceId();

  // KÍCH HOẠT CAMERA TRƯỚC VỚI RÀNG BUỘC CHUẨN ĐA THIẾT BỊ
  async function khoiDongCamera() {
    btnOpenCam.style.display = "none";
    
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      baoLoi("Trình duyệt không hỗ trợ mở camera trực tiếp. Vui lòng mở bằng Chrome hoặc Safari!", false);
      btnOpenCam.style.display = "block";
      return;
    }

    try {
      // Ưu tiên camera trước (user)
      streamGoc = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = streamGoc;
      await video.play();
    } catch (e1) {
      try {
        // Fallback: nếu máy không phân biệt được "user", mở camera bất kỳ
        streamGoc = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = streamGoc;
        await video.play();
      } catch (e2) {
        baoLoi("Vui lòng bấm 'Cho phép' khi trình duyệt hỏi quyền sử dụng Camera!", false);
        btnOpenCam.style.display = "block";
      }
    }
  }

  // HÀM CHỤP KHUNG HÌNH TRỰC TIẾP TỪ VIDEO
  function chupAnhNgay() {
    if (!streamGoc || video.videoWidth === 0) {
      baoLoi("Camera chưa sẵn sàng hoặc chưa hiển thị hình ảnh!", false);
      khoiDongCamera();
      return;
    }

    const ctx = canvas.getContext("2d");
    canvas.width = 400;
    canvas.height = 300;
    
    // Đảo ngược khung vẽ để ảnh chụp giống hệt gương soi
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    finalBase64Image = canvas.toDataURL("image/jpeg", 0.7);

    // Hiển thị ảnh chụp tĩnh lên màn hình
    capturedPhoto.src = finalBase64Image;
    capturedPhoto.style.display = "block";
    video.style.display = "none";

    btnSnap.style.display = "none";
    btnRetake.style.display = "block";
    baoLoi("Đã chụp khuôn mặt! Hãy bấm 'Xác Nhận & Gửi Điểm Danh'.", true);
  }

  // HÀM CHỤP LẠI
  function chupLai() {
    finalBase64Image = "";
    capturedPhoto.style.display = "none";
    video.style.display = "block";
    btnSnap.style.display = "block";
    btnRetake.style.display = "none";
    document.getElementById("msg").style.display = "none";
  }

  window.onload = function() {
    document.getElementById("devInfo").innerText = "Mã máy: " + myDeviceId;
    khoiDongCamera();
  };

  function tinhKhoangCach(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  function baoLoi(text, thanhCong) {
    const msg = document.getElementById("msg");
    msg.className = thanhCong ? "alert success" : "alert error";
    msg.innerHTML = text;
    msg.style.display = "block";
  }

  function guiDiemDanh() {
    const select = document.getElementById("student");
    const maHS = select.value;
    const tenHS = select.options[select.selectedIndex].text;
    const pinCCCD = document.getElementById("passcode").value.trim();
    const btn = document.getElementById("btnSubmit");

    if (!maHS) { baoLoi("Vui lòng chọn họ tên học sinh!", false); return; }
    if (pinCCCD.length !== 4) {
      baoLoi("Vui lòng nhập đúng 4 số cuối Căn cước công dân (CCCD)!", false);
      return;
    }
    if (!finalBase64Image) {
      baoLoi("<strong>Chưa có ảnh!</strong> Vui lòng bấm nút '📸 Chụp Ảnh Ngay' trước khi gửi điểm danh.", false);
      return;
    }

    btn.disabled = true;
    btn.innerText = "Đang kiểm tra vị trí & gửi dữ liệu...";

    if (!navigator.geolocation) {
      baoLoi("Thiết bị không hỗ trợ định vị GPS.", false);
      btn.disabled = false;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const khoangCach = tinhKhoangCach(pos.coords.latitude, pos.coords.longitude, TRUONG_LAT, TRUONG_LNG);
        btn.innerText = "Đang truyền ảnh lên Google Drive...";

        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            studentId: maHS,
            studentName: tenHS,
            passcode: pinCCCD,
            deviceId: myDeviceId,
            distance: khoangCach,
            imageBase64: finalBase64Image
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.result === "success") {
            baoLoi(`Điểm danh thành công!<br><strong>${tenHS}</strong><br>Đã lưu ảnh chân dung và khóa máy.<br>Giờ: ${new Date().toLocaleTimeString('vi-VN')}`, true);
            btn.innerText = "Đã hoàn thành";
          } else {
            baoLoi("<strong>Lỗi:</strong> " + data.message, false);
            btn.disabled = false;
            btn.innerText = "Xác Nhận & Gửi Điểm Danh";
          }
        })
        .catch(() => {
          baoLoi("Lỗi kết nối mạng, vui lòng kiểm tra lại 4G/Wi-Fi!", false);
          btn.disabled = false;
          btn.innerText = "Xác Nhận & Gửi Điểm Danh";
        });
      },
      (err) => {
        baoLoi("Vui lòng BẬT ĐỊNH VỊ (GPS) trên điện thoại để hoàn tất điểm danh.", false);
        btn.disabled = false;
        btn.innerText = "Xác Nhận & Gửi Điểm Danh";
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
</script>

</body>
</html>
